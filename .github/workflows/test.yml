name: Test Cask

# Comprueba el Cask de verdad en las dos plataformas: auditoría e instalación.
# Homebrew no se puede ejecutar en Windows, así que esta es la única forma de
# validar la sintaxis de los bloques on_macos / on_linux antes de que llegue a
# un usuario.

on:
  push:
    paths: [Casks/**, .github/workflows/test.yml]
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: este workflow solo lee el repositorio.
permissions:
  contents: read

jobs:
  cask:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Sin token, `brew audit --online` agota el límite de la API de GitHub
      # (las IP de los runners son compartidas) y falla sin auditar nada.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Homebrew (Linux)
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@main

      - name: Registrar este repositorio como tap
        run: |
          # `brew tap <user/repo> <ruta>` espera una URL remota y falla con una
          # ruta local, así que se copia el repo al directorio de taps, que
          # Homebrew reconoce igual y prueba exactamente lo que hay en este
          # commit. En Linux, `setup-homebrew` ya registra el repo actual: si el
          # directorio existe, no hay nada que hacer.
          TAP_DIR="$(brew --repository)/Library/Taps/davidbuenov/homebrew-dbv-typst-editor"
          if [ ! -d "$TAP_DIR" ]; then
            mkdir -p "$TAP_DIR"
            cp -R "$GITHUB_WORKSPACE/." "$TAP_DIR/"
          fi
          brew tap

      - name: Auditar el Cask
        run: brew audit --cask --online davidbuenov/dbv-typst-editor/dbv-typst-editor

      - name: Instalar el Cask (sin avisos de obsolescencia)
        run: |
          # Homebrew avisa a los usuarios de sintaxis obsoleta del Cask (así se
          # detectó `preflight` en Homebrew 7): que el CI lo vea antes que ellos.
          brew install --cask davidbuenov/dbv-typst-editor/dbv-typst-editor 2>&1 | tee install.log
          if grep -qi "deprecated" install.log; then
            echo "::error::Homebrew avisa de sintaxis obsoleta en el Cask" >&2
            exit 1
          fi

      - name: Comprobar el comando typs
        run: |
          TYPS="$(brew --prefix)/bin/typs"
          test -x "$TYPS"
          echo "--- contenido de typs:"; cat "$TYPS"
          # El script debe llamar a la aplicación de verdad en cada plataforma.
          if [ "$RUNNER_OS" = macOS ]; then
            grep -q 'open -a "DBV Typst Editor"' "$TYPS"
          else
            grep -q 'nohup' "$TYPS"
            # El AppImage al que apunta `typs` existe y es ejecutable.
            test -x "$HOME/Applications/DBV-Typst-Editor.AppImage"
          fi

      - name: Desinstalar el Cask
        run: brew uninstall --cask davidbuenov/dbv-typst-editor/dbv-typst-editor

      - name: Comprobar que desinstalar retira el comando typs
        run: test ! -e "$(brew --prefix)/bin/typs"
